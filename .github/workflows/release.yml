name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+' # matches semantic versioning tags like v1.2.3

jobs:
  publish-tauri:
    permissions:
      contents: write
    runs-on: windows-latest
    env:
      NODE_OPTIONS: --max_old_space_size=4096
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: generate changelog
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v6
        with:
          mode: COMMIT
          failOnError: true
          configurationJson: |
            {
              "template": "#{{CHANGELOG}}\n\n<details>\n<summary>:gear: Maintenance changes</summary>\n\n#{{UNCATEGORIZED}}\n</details>\n\n#{{RELEASE_DIFF}}",
              "empty_template": "No changes were detected.\n\n#{{RELEASE_DIFF}}",
              "categories": [
                {
                  "title": "### :sparkles: New Features",
                  "labels": ["feat"]
                },
                {
                  "title": "### :hammer: Bug Fixes",
                  "labels": ["fix"]
                },
                {
                  "title": "### :rocket: Performance",
                  "labels": ["perf"]
                },
                {
                  "title": "### :recycle: Refactors",
                  "labels": ["refactor"]
                },
                {
                  "title": "### :art: UI & Style",
                  "labels": ["style"]
                }
              ],
              "label_extractor": [
                {
                  "pattern": "^(build|bump|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)([(][A-Za-z0-9_./-]+[)])?!?: .+",
                  "on_property": "title",
                  "target": "$1"
                }
              ],
              "commit_template": "- #{{TITLE}} (by @#{{AUTHOR}})"
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: setup rust
        uses: dtolnay/rust-toolchain@stable

      - name: install pnpm
        run: npm install -g pnpm@latest-11

      - name: install frontend dependencies
        run: pnpm install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: 'v__VERSION__'
          releaseName: 'v__VERSION__'
          releaseBody: ${{ steps.changelog.outputs.changelog }}
          releaseDraft: true
          prerelease: false
