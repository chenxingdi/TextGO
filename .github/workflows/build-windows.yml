name: build-windows

# Manual or branch-triggered Windows x64 build for verification.
# Kept separate from release.yml so it never publishes a release or needs signing keys.
on:
  workflow_dispatch:
  push:
    branches:
      - 'ci/**'

jobs:
  check-and-build:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      NODE_OPTIONS: --max_old_space_size=4096

    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: setup rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: cache rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: install pnpm
        run: npm install -g pnpm@latest-11

      - name: install frontend dependencies
        run: pnpm install --frozen-lockfile

      # the generated messages are gitignored and are otherwise only produced by the vite plugin
      - name: compile messages
        run: npx paraglide-js compile --project ./project.inlang --outdir ./src/lib/paraglide

      - name: lint rust
        id: clippy
        shell: bash
        continue-on-error: true
        run: |
          cargo clippy --manifest-path ./src-tauri/Cargo.toml --all-targets --message-format=short -- -D warnings > clippy.log 2>&1
          echo "status=$?" >> "$GITHUB_OUTPUT"
          cat clippy.log

      # the run log requires a login, so publish the diagnostics inside the branch itself
      - name: publish clippy log
        if: steps.clippy.outputs.status != '0'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp clippy.log ci-clippy.log
          git add -f ci-clippy.log
          git commit -m "ci: clippy diagnostics [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: fail on clippy errors
        if: steps.clippy.outputs.status != '0'
        run: exit 1

      - name: run rust tests
        run: cargo test --manifest-path ./src-tauri/Cargo.toml --lib

      - name: check frontend
        run: pnpm check

      - name: lint frontend
        run: npx eslint src

      - name: run frontend tests
        run: |
          node --test scripts/predicate.test.mjs
          node --test scripts/classifier.test.mjs

      - name: build windows x64 executable
        run: pnpm tauri build --no-bundle

      - name: list build output
        run: Get-ChildItem src-tauri/target/release -Filter *.exe | Select-Object Name, Length

      - name: upload executable
        uses: actions/upload-artifact@v4
        with:
          name: TextGO-windows-x64
          # the binary name follows the crate or product name depending on the tauri version
          path: |
            src-tauri/target/release/*.exe
            !src-tauri/target/release/build/**
          if-no-files-found: error
          retention-days: 14
