name: build-windows

# Manual or branch-triggered Windows x64 build for verification.
# Kept separate from release.yml so it never publishes a release or needs signing keys.
on:
  workflow_dispatch:
  push:
    branches:
      - 'ci/**'

jobs:
  check-and-build:
    runs-on: windows-latest
    env:
      NODE_OPTIONS: --max_old_space_size=4096

    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: setup rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: cache rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: install pnpm
        run: npm install -g pnpm@latest-11

      - name: install frontend dependencies
        run: pnpm install --frozen-lockfile

      # the generated messages are gitignored and are otherwise only produced by the vite plugin
      - name: compile messages
        run: npx paraglide-js compile --project ./project.inlang --outdir ./src/lib/paraglide

      - name: check rust formatting
        run: cargo fmt --manifest-path ./src-tauri/Cargo.toml --check

      - name: lint rust
        run: cargo clippy --manifest-path ./src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: run rust tests
        run: cargo test --manifest-path ./src-tauri/Cargo.toml --lib

      - name: check frontend
        run: pnpm check

      - name: lint frontend
        run: npx eslint src

      - name: run frontend tests
        run: |
          node --test scripts/predicate.test.mjs
          node --test scripts/classifier.test.mjs

      - name: build windows x64 executable
        run: pnpm tauri build --no-bundle

      - name: list build output
        run: Get-ChildItem src-tauri/target/release -Filter *.exe | Select-Object Name, Length

      - name: upload executable
        uses: actions/upload-artifact@v4
        with:
          name: TextGO-windows-x64
          # the binary name follows the crate or product name depending on the tauri version
          path: |
            src-tauri/target/release/*.exe
            !src-tauri/target/release/build/**
          if-no-files-found: error
          retention-days: 14
